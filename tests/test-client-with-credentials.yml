name: Test client action with credentials and file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run client action with credentials and file inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          app_id: "12345"
          app_private_key: "fake-private-key-for-testing"
          server_repository: example/securefix-server
          commit_message: "fix: automated security fix"
          branch: main
          repository: example/repo
          root_dir: "."
          files: |
            src/main.go
            src/util.go
          custom: '{"key": "value"}'
          use_git_ls_files: "false"
          fail_if_changes: "false"

      - name: Assert action ran (with credentials inputs)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # With fake credentials, the action should fail (bad credentials)
          # but it should have run (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
