name: Test prepare action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: prepare
        name: Run prepare action
        uses: .
        with:
          action: prepare
          workflow_name: securefix
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"
        continue-on-error: true

      - name: Assert prepare action ran
        run: |
          echo "prepare outcome: ${{ steps.prepare.outcome }}"
          # Without a valid label event context, prepare may fail gracefully
          # but it should not be skipped
          if [ "${{ steps.prepare.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: prepare action ran (outcome: ${{ steps.prepare.outcome }})"
