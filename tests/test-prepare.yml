name: Test prepare action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          app_id: "12345"
          app_private_key: "fake-private-key"
          outputs: '{"key": "value"}'
          commit_error: ""
          label_name: securefix
          label_description: example/repo/123456789
          delete_label: "true"
          github_token_to_delete_label: "fake-token"
      - name: Assert action ran
        run: |
          echo "conclusion: ${{ steps.action.conclusion }}"
          echo "PASS: action step executed"
