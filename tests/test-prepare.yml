name: Test prepare action mode
on:
  workflow_dispatch:
jobs:
  test-prepare:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          workflow_name: securefix
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"

      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action produced outcome=$OUTCOME"
