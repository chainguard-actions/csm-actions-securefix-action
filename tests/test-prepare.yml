name: Test prepare action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          app_id: "12345"
          app_private_key: "fake-private-key"
          workflow_name: securefix
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"
          label_name: "securefix"
          label_description: "example-org/example-repo/123456789"
          delete_label: "true"
          github_token_to_delete_label: "fake-token"
          project_owner: "example-org"
          project_number: "1"
          project_id: "PVT_abc123"
          milestone_number: "1"
      - name: Assert action ran (may fail due to missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome to be success or failure, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with outcome $OUTCOME"
