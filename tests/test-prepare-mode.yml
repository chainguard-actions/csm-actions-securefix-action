name: Test prepare mode inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          app_id: "12345"
          app_private_key: "fake-private-key"
          outputs: '{"key":"value"}'
          workflow_name: "securefix"
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"
          config: |
            repositories:
              - name: example-org/example-repo
                branch: main
          config_file: ""
          label_name: "securefix"
          label_description: "example-org/securefix-server/123456"
          delete_label: "true"
          github_token_to_delete_label: "fake-token"
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was invoked with all prepare inputs"
