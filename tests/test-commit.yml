name: Test commit action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: commit
          app_id: "12345"
          app_private_key: "fake-private-key"
          commit_message: "fix: apply secure fixes"
          commit_error: ""
          outputs: '{"key": "value"}'
      - name: Assert action ran (may fail due to missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome to be success or failure, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with outcome $OUTCOME"
