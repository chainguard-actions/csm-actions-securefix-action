name: Test commit action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: commit
          app_id: "12345"
          app_private_key: "fake-private-key"
          commit_message: "chore: auto fix"
          commit_error: ""
          pull_request_comment: "Commit completed"
      - name: Assert action ran
        run: |
          echo "conclusion: ${{ steps.action.conclusion }}"
          echo "PASS: commit action step executed"
