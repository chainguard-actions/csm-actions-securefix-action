name: Test client mode with missing required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          server_repository: owner/server-repo

      - name: Assert client mode failed with missing app credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected client mode to fail when app_id and app_private_key are missing, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: client mode correctly failed with missing app credentials"
