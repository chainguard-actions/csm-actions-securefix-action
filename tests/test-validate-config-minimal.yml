name: Test validate-config with minimal valid config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config with minimal config (no optional fields)
        id: action
        uses: .
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - example/client
                push:
                  branches:
                    - main

      - name: Assert action succeeded
        run: |
          echo "validate-config with minimal config completed successfully"
          echo "PASS"
