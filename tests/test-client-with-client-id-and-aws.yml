name: Test client action with client_id and AWS KMS inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          client_id: "Iv1.abc123def456"
          aws_kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/12345678-1234-1234-1234-123456789012"
          aws_region: "us-east-1"
          aws_role_to_assume: "arn:aws:iam::123456789012:role/GitHubActionsRole"
          server_repository: "example-org/securefix-server"
          repository: "example-org/example-repo"
          branch: "fix/automated-fix"
          commit_message: "fix: automated security fix"
          outputs: '{"key":"value"}'
          commit_error: ""
      - name: Assert action ran (fails gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials/AWS config)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
