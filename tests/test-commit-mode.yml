name: Test commit mode inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: commit
          app_id: "12345"
          app_private_key: "fake-private-key"
          commit_message: "fix: apply securefix changes"
          commit_error: ""
          pull_request_comment: "Securefix commit completed."
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Step outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was invoked with all commit inputs"
