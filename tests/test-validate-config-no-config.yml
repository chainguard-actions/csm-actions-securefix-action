name: Test validate-config with no config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config without config or config_file
        id: action
        uses: .
        with:
          action: validate-config
        continue-on-error: true

      - name: Assert action failed with missing config error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no config is provided, got outcome=$OUTCOME"
            exit 1
          fi
          if ! echo "$ERROR" | grep -qi "config"; then
            echo "FAIL: expected error message to mention 'config', got: $ERROR"
            exit 1
          fi
          echo "PASS: action correctly failed with missing config error"
