name: Test validate-config with no config input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          # Neither config nor config_file is provided
      - name: Assert validate-config failed when no config provided
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected validate-config to fail when no config is provided, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: validate-config correctly failed when no config provided"
