name: Test commit action with error and outputs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run commit action with commit_error and outputs inputs
        id: action
        uses: .
        with:
          action: commit
          commit_error: "some error occurred during commit"
          outputs: '{"key": "value"}'
          commit_message: "fix: automated security fix"
        continue-on-error: true

      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action produced outcome=$OUTCOME"
