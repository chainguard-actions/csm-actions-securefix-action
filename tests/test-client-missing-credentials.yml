name: Test client action with missing credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          server_repository: example/server
          # app_id and app_private_key are intentionally omitted to test error handling
      - name: Assert client action failed gracefully without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected client action to fail without credentials, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: client action correctly failed without credentials"
