name: Test client action with missing credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run client action without credentials
        id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          server_repository: example/securefix-server
          commit_message: "fix: automated security fix"
          branch: main
          repository: example/repo

      - name: Assert action failed gracefully (missing credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # Without app_id and app_private_key, the action should fail
          # but not crash the runner itself
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run and fail"
            exit 1
          fi
          # The action should have run (either success or failure is acceptable
          # since we don't have real credentials)
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
