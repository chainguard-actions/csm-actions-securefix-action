name: Test validate-config with multi-entry config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - owner/repo-a
                    - owner/repo-b
                  branches:
                    - main
                    - develop
                push:
                  repositories:
                    - owner/server-repo
                  branches:
                    - securefix/auto
              - client:
                  repositories:
                    - owner/repo-c
                push:
                  branches:
                    - fix/auto
        continue-on-error: false
      - name: Assert action succeeded with multi-entry config
        run: |
          echo "validate-config with multi-entry config completed successfully"
          echo "PASS"
