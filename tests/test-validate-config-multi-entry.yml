name: Test validate-config with multiple entries
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config with multiple config entries
        id: action
        uses: .
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - owner/repo-a
                    - owner/repo-b
                  branches:
                    - main
                push:
                  repositories:
                    - owner/server-repo
                  branches:
                    - securefix/fix
              - client:
                  repositories:
                    - owner/repo-c
                push:
                  branches:
                    - automated/securefix

      - name: Assert action succeeded
        run: |
          echo "validate-config with multiple entries completed successfully"
          echo "PASS"
