name: Test client action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          app_id: "12345"
          app_private_key: "fake-private-key"
          server_repository: "example-org/securefix-server"
          files: "file1.txt\nfile2.txt"
          commit_message: "fix: apply secure fixes"
          pull_request_comment: "Automated fix applied"
          repository: "example-org/example-repo"
          branch: "securefix/automated-fix"
          root_dir: "."
          pull_request_title: "Automated Security Fix"
          pull_request_base_branch: "main"
          pull_request_body: "This PR applies automated security fixes."
          pull_request_labels: "security\nautomated"
          pull_request_draft: "false"
          pull_request_reviewers: "reviewer1\nreviewer2"
          pull_request_team_reviewers: "security-team"
          pull_request_assignees: "assignee1"
          automerge_method: "squash"
          custom: '{"key": "value"}'
      - name: Assert action ran (may fail due to missing credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome to be success or failure, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with outcome $OUTCOME"
