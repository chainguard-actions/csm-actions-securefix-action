name: Test validate-config action
on:
  workflow_dispatch:
jobs:
  test-validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal config file
        run: |
          cat > /tmp/securefix-config.yaml << 'EOF'
          repositories:
            - repository: octocat/hello-world
              branch: main
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config: |
            repositories:
              - repository: octocat/hello-world
                branch: main

      - name: Assert action ran (validate-config does not require GitHub credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # validate-config may succeed or fail depending on config requirements,
          # but the action should at least start and produce an outcome
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action produced outcome=$OUTCOME"
