name: Test validate-config action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file
        run: |
          mkdir -p /tmp/securefix-test
          cat > /tmp/securefix-test/config.yaml << 'EOF'
          repositories:
            - name: example-org/example-repo
              branch: main
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config: |
            repositories:
              - name: example-org/example-repo
                branch: main
          config_file: "/tmp/securefix-test/config.yaml"
      - name: Assert action ran (may fail due to invalid config)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
