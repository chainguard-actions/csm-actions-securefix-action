name: Test validate-config with valid config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config with valid inline config
        id: action
        uses: .
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - owner/repo-a
                  branches:
                    - main
                push:
                  branches:
                    - securefix/fix
        continue-on-error: true

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with valid config, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS"
