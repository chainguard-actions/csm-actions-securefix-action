name: Test unknown action name fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          action: unknown-action-name
        continue-on-error: true
      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error output: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown action name, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unknown action name"
