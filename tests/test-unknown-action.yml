name: Test unknown action type fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unknown action type
        id: action
        uses: .
        with:
          action: unknown-invalid-action
        continue-on-error: true

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown action type, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with unknown action type"
