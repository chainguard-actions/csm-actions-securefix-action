name: Test unknown action name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unknown action name
        id: action
        uses: .
        with:
          action: unknown-action-name
        continue-on-error: true

      - name: Assert action failed with unknown action error
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unknown action name, got outcome=$OUTCOME"
            exit 1
          fi
          if ! echo "$ERROR_OUTPUT" | grep -qi "unknown"; then
            echo "FAIL: expected error message to mention 'unknown', got: $ERROR_OUTPUT"
            exit 1
          fi
          echo "PASS: action correctly failed with unknown action error"
