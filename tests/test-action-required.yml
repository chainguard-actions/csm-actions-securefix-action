name: Test action input is required without server_repository
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed when action input is missing and no server_repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'action' input is not provided and server_repository is not set, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'action' input is missing"
