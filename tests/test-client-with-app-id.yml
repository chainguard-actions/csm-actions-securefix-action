name: Test client action with app_id and pull request inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          app_id: "12345"
          app_private_key: "fake-private-key"
          server_repository: "example-org/securefix-server"
          repository: "example-org/example-repo"
          branch: "fix/automated-fix"
          root_dir: "."
          commit_message: "fix: automated security fix"
          files: "file1.txt\nfile2.txt"
          custom: '{"key":"value"}'
          pull_request_title: "Automated Security Fix"
          pull_request_base_branch: "main"
          pull_request_body: "This PR contains automated security fixes."
          pull_request_labels: "security\nautomated"
          pull_request_reviewers: "reviewer1"
          pull_request_team_reviewers: "security-team"
          pull_request_assignees: "assignee1"
          pull_request_comment: "Please review this automated fix."
          pull_request_draft: "false"
          automerge_method: "squash"
          milestone_number: "1"
          project_owner: "example-org"
          project_number: "42"
          project_id: "PVT_abc123"
      - name: Assert action ran (fails gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
