name: Test validate-config with config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file
        run: |
          mkdir -p /tmp/securefix-test
          cat > /tmp/securefix-test/config.yaml << 'EOF'
          entries:
            - client:
                repositories:
                  - example/client
                branches:
                  - main
              push:
                branches:
                  - feat/*
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config_file: /tmp/securefix-test/config.yaml
      - name: Assert validate-config-from-file succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected validate-config to succeed with valid config_file, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: validate-config succeeded reading from config_file"
