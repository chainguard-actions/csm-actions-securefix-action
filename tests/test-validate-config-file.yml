name: Test validate-config with config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a valid config file
        run: |
          cat > /tmp/securefix-config.yaml << 'EOF'
          entries:
            - client:
                repositories:
                  - owner/repo-a
                branches:
                  - main
              push:
                branches:
                  - securefix/fix
          EOF

      - name: Run validate-config with config_file
        id: action
        uses: .
        with:
          action: validate-config
          config_file: /tmp/securefix-config.yaml
        continue-on-error: true

      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed with valid config_file, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS"
