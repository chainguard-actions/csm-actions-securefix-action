name: Test validate-config with config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file
        run: |
          cat > /tmp/securefix-config.yaml << 'EOF'
          entries:
            - client:
                repositories:
                  - owner/client-repo
                branches:
                  - main
              push:
                branches:
                  - fix/securefix
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config_file: /tmp/securefix-config.yaml

      - name: Assert validate-config succeeded with config_file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected validate-config to succeed with valid config_file, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: validate-config succeeded with config_file input"
