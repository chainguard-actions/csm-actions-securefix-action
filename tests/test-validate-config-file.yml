name: Test validate-config with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create config file
        run: |
          mkdir -p /tmp/securefix-test
          cat > /tmp/securefix-test/config.yaml << 'EOF'
          entries:
            - client:
                repositories:
                  - owner/client-repo
                branches:
                  - main
              push:
                branches:
                  - securefix/auto-fix
          EOF
      - id: action
        uses: .
        with:
          action: validate-config
          config_file: /tmp/securefix-test/config.yaml
        continue-on-error: false
      - name: Assert action succeeded
        run: |
          echo "validate-config with config_file completed successfully"
          echo "PASS"
