name: Test validate-config with config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file
        run: |
          cat > /tmp/securefix-config.yaml << 'EOF'
          entries:
            - client:
                repositories:
                  - owner/client-repo
                branches:
                  - main
                  - develop
              push:
                branches:
                  - securefix/automated-fix
          EOF

      - name: Run validate-config with config file
        id: action
        uses: .
        with:
          action: validate-config
          config_file: /tmp/securefix-config.yaml

      - name: Assert action succeeded
        run: |
          echo "validate-config with config_file completed successfully"
          echo "PASS"
