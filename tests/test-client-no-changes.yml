name: Test client action with no changes
on:
  workflow_dispatch:
jobs:
  test-client-no-changes:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          fail_if_changes: "false"
          use_git_ls_files: "true"
          commit_message: "fix: automated security fix"

      - name: Assert action ran and produced an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not produce an outcome"
            exit 1
          fi
          echo "PASS: action produced outcome=$OUTCOME"

      - name: Assert changed_files output is present (may be empty)
        env:
          CHANGED_FILES: ${{ steps.action.outputs.changed_files }}
        run: |
          echo "changed_files: '$CHANGED_FILES'"
          # Output may be empty when there are no changes — that is acceptable
          echo "PASS: changed_files output checked"
