name: Test AWS KMS credential inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          app_id: "12345"
          aws_kms_key_id: "arn:aws:kms:us-east-1:123456789012:key/fake-key-id"
          aws_region: "us-east-1"
          aws_role_to_assume: "arn:aws:iam::123456789012:role/fake-role"
          server_repository: "example-org/securefix-server"
          commit_message: "fix: automated security fix"
      - name: Assert action ran (fails gracefully with fake AWS credentials/sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
