name: Test client action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          app_id: "12345"
          app_private_key: "dummy-private-key"
          server_repository: "example-org/securefix-server"
          files: "file1.txt\nfile2.txt"
          commit_message: "fix: apply security fixes"
          pull_request_comment: "Security fixes have been applied."
          repository: "example-org/example-repo"
          branch: "securefix/auto-fix"
          root_dir: "."
          pull_request_title: "Security Fix"
          pull_request_base_branch: "main"
          pull_request_body: "This PR applies automated security fixes."
          pull_request_labels: "security\nautomated"
          pull_request_draft: "false"
          pull_request_reviewers: "reviewer1\nreviewer2"
          pull_request_team_reviewers: "security-team"
          pull_request_assignees: "assignee1"
          automerge_method: "squash"
          custom: '{"key":"value"}'
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real credentials,
          # but it should at least attempt to run (not be skipped).
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
