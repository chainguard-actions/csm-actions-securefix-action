name: Test missing credentials handling
on:
  workflow_dispatch:
jobs:
  test-missing-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          action: client
          server_repository: example-org/securefix-server
          # Intentionally omitting app_id, client_id, app_private_key, aws_kms_key_id
          # to test that the action fails gracefully with a meaningful error

      - name: Assert action fails gracefully when credentials are missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected when credentials are missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly without credentials"
            echo "PASS: treating as acceptable (action may have a no-op path)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
