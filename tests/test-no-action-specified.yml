name: Test action with no action specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without specifying action or server_repository
        id: action
        uses: .
        continue-on-error: true

      - name: Assert action failed due to missing action input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ERROR_OUTPUT: ${{ steps.action.outputs.error }}
        run: |
          echo "outcome: $OUTCOME"
          echo "error: $ERROR_OUTPUT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no action or server_repository is provided, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing action input"
