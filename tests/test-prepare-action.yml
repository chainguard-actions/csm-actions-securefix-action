name: Test prepare action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          app_id: "12345"
          app_private_key: "dummy-private-key"
          workflow_name: securefix
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"
          label_name: "securefix"
          label_description: "example-org/securefix-server/123456"
          delete_label: "true"
          github_token_to_delete_label: "dummy-token"
          project_owner: "example-org"
          project_number: "1"
          project_id: "PVT_abc123"
          milestone_number: "1"
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=${{ steps.action.outcome }})"
