name: Test prepare action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: labeled
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run prepare action
        id: action
        uses: .
        continue-on-error: true
        with:
          action: prepare
          workflow_name: securefix
          allow_workflow_fix: "false"
          allow_members_read: "false"
          allow_organization_projects_write: "false"
          label_name: securefix
          label_description: example/repo/12345
          delete_label: "false"

      - name: Assert prepare action ran
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # Without valid GitHub App credentials and a real label event,
          # the prepare action is expected to fail, but it should run
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome ${{ steps.action.outcome }}"
