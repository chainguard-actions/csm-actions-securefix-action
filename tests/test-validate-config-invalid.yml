name: Test validate-config with invalid config fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config with invalid config (missing push.branches)
        id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - example/client

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid config, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid config"
