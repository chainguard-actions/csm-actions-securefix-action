name: Test validate-config fails with invalid config schema
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run validate-config with invalid config (missing required fields)
        id: action
        uses: .
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - owner/repo-a
                # push is required but missing here
        continue-on-error: true

      - name: Assert action failed with schema validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config schema is invalid"
            exit 1
          fi
          echo "PASS: action correctly failed for invalid config schema"
