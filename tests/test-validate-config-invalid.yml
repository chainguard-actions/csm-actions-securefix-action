name: Test validate-config with invalid config
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          action: validate-config
          config: |
            entries:
              - client:
                  repositories:
                    - example/client
                # push is required but missing here
      - name: Assert validate-config failed on invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected validate-config to fail with invalid config (missing push), got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: validate-config correctly failed with invalid config"
